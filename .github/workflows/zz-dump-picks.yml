name: ZZ 选股导出

# 临时：导出「今日推荐」选股结果供合并进报告（用完删除）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: 恢复行业缓存
        uses: actions/cache@v4
        with:
          path: data/industry_provider_cache
          key: dump-industry-${{ github.run_id }}
          restore-keys: |
            probe-industry-
            industry-cache-

      - name: 导出选股
        id: dump
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LLM_CHANNELS: ${{ vars.LLM_CHANNELS || secrets.LLM_CHANNELS }}
          LITELLM_FALLBACK_MODELS: 'deepseek/deepseek-v4-flash'
          DAILY_PICKS_ENABLED: 'true'
          DAILY_PICKS_STRATEGY: 'momentum_quality'
          DAILY_PICKS_COUNT: '5'
          LLM_MAX_TOKENS: '8192'
          LLM_MAX_CANDIDATES: '15'
          INDUSTRY_PROVIDER: 'akshare'
          INDUSTRY_PROVIDER_CACHE_TTL_HOURS: '168'
        run: |
          mkdir -p out
          python .github/scripts/dump_picks.py > out/log.txt 2>&1 || true
          tail -20 out/log.txt
          V=$(grep -oE "VERDICT: .*" out/log.txt | tail -1 | sed 's/VERDICT: //' | tr -cd 'A-Za-z0-9._-')
          echo "verdict=${V:-unknown}" >> $GITHUB_OUTPUT

      - name: 上传选股结果
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: picksdump-${{ steps.dump.outputs.verdict || 'unknown' }}
          path: out/
          retention-days: 3
