name: 搜索源连通性测试

# 临时：用仓库自身 SearchService 验证 SearXNG 公共实例能否搜到 A 股新闻
# 验证后删除本文件与 .github/scripts/probe_searxng_*.py
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: 用真实 SearchService 测试新闻搜索
        id: probe
        run: |
          mkdir -p out
          python .github/scripts/probe_searxng_intel.py > out/intel.txt 2>&1 || true
          tail -80 out/intel.txt
          OK=$(grep -oE "dims_with_results=[0-9]+" out/intel.txt | tail -1 | grep -oE "[0-9]+")
          TOT=$(grep -oE "total_dims=[0-9]+" out/intel.txt | tail -1 | grep -oE "[0-9]+")
          OK=${OK:-0}; TOT=${TOT:-0}
          echo "verdict=ok${OK}-of${TOT}" >> $GITHUB_OUTPUT

      - name: 上传结果
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: intelprobe-${{ steps.probe.outputs.verdict || 'unknown' }}
          path: out/
          retention-days: 3
