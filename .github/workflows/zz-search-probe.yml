name: ZZ 搜索密钥验证

# 临时：验证 TAVILY_API_KEYS 是否已注入且真实可用（验证后删除）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 验证密钥与搜索
        continue-on-error: true
        env:
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
        run: |
          mkdir -p out
          LOG=out/log.txt
          echo "=== 1. 密钥检查 ===" > $LOG
          if [ -n "$TAVILY_API_KEYS" ]; then
            echo "TAVILY_API_KEYS 已配置，长度 ${#TAVILY_API_KEYS}，前缀 ${TAVILY_API_KEYS:0:4}" >> $LOG
          else
            echo "TAVILY_API_KEYS 为空" >> $LOG
          fi

          KEY=$(printf '%s' "$TAVILY_API_KEYS" | cut -d',' -f1 | tr -d ' \r\n')
          echo "" >> $LOG
          echo "=== 2. 调用 Tavily 搜索（关键词：中兴通讯） ===" >> $LOG
          CODE=$(curl -s -m 40 -o /tmp/tv.json -w "%{http_code}" -X POST https://api.tavily.com/search \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"$KEY\",\"query\":\"中兴通讯 最新消息\",\"search_depth\":\"basic\",\"max_results\":3}")
          echo "HTTP 状态: $CODE" >> $LOG
          echo "--- 响应前 700 字符 ---" >> $LOG
          head -c 700 /tmp/tv.json >> $LOG
          echo "" >> $LOG
          echo "--- 结果条数 ---" >> $LOG
          grep -o '"results"' /tmp/tv.json | wc -l >> $LOG
          grep -o '"title"' /tmp/tv.json | wc -l >> $LOG
          echo "（上面两行：results 出现次数 / title 出现次数，均 >0 表示有返回）" >> $LOG

          cat $LOG

      - name: 上传验证日志
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: searchprobe2
          path: out/
          retention-days: 2
