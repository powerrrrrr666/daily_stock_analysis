name: 搜索源连通性测试

# 临时测试工作流：按代码相同逻辑（成功率排序 + format=json）验证 SearXNG 公共实例
# 测试后删除本文件与 .github/scripts/probe_searxng_rank.py
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 按代码逻辑测试公共实例
        id: probe
        run: |
          mkdir -p out
          : > out/result.txt

          CODE=$(curl -s -m 25 -o out/instances.json -w "%{http_code}" "https://searx.space/data/instances.json" || echo 000)
          echo "searx.space HTTP=${CODE}" | tee -a out/result.txt

          python3 .github/scripts/probe_searxng_rank.py 2>&1 | tee -a out/result.txt

          echo "候选实例（按成功率降序）:" | tee -a out/result.txt
          cat out/ranked.txt | tee -a out/result.txt

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
          OK=0; TRY=0
          while read -r U && [ $TRY -lt 12 ]; do
            [ -z "$U" ] && continue
            TRY=$((TRY+1))
            R=$(curl -s -m 12 -G "$U/search" \
                 --data-urlencode "q=高德红外 最新消息" \
                 --data-urlencode "format=json" \
                 --data-urlencode "time_range=week" \
                 --data-urlencode "pageno=1" \
                 -H "User-Agent: $UA" 2>/dev/null)
            N=$(printf '%s' "$R" | grep -c '"title"' || true)
            echo "[$TRY] $U -> 结果条数=${N}" | tee -a out/result.txt
            if [ "${N:-0}" -gt 0 ]; then OK=$((OK+1)); fi
          done < out/pool.txt

          echo "成功实例数: ${OK} / ${TRY}" | tee -a out/result.txt
          echo "verdict=try${TRY}-ok${OK}" >> $GITHUB_OUTPUT
          echo "=== 结论: 尝试 ${TRY} 个，成功 ${OK} 个 ==="

      - name: 上传测试结论
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: searchprobe2-${{ steps.probe.outputs.verdict || 'unknown' }}
          path: out/
          retention-days: 3
